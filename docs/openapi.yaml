      description: |
        Возвращает слова для конкретной категории. Для premium-категорий проверяет is_premium в профиле пользователя.
        Если WordPack для запрошенной локали не найден — сервер возвращает fallback на `en`, не ошибку.
      tags: [Categories]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/LocaleHeader'
        - name: category_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID категории
        - name: locale
          in: query
          required: false
          schema:
            type: string
            default: en
          description: ISO locale. Fallback en
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [standard, party]
            default: standard
        - name: count
          in: query
          required: false
          schema:
            type: integer
            default: 1
