openapi: 3.0.3
info:
  title: Imposter AI API
  version: 1.0.0
  description: |
    # Imposter AI — Backend Specification

    Backend API для игры Imposter AI — управление категориями, AI-генерацией слов, premium-контентом и remote config.

    ---

    ## Сущности

    ### Category
    Описывает тематическую категорию слов. Делятся на free и premium через флаг `is_premium`.
    Активность управляется через `is_active` — скрывает без удаления. `sort_order` определяет порядок в клиенте.
    Все текстовые поля хранятся как LocalizedString — JSON-объект с ключами по ISO locale.

    ### WordPack
    Набор слов привязанный к категории. Создаётся отдельно под каждую локаль — автоматического перевода нет.
    - Для стандартного режима `impostor_word = null` — impostor не получает слово.
    - Для Party Mode (Undercover) `impostor_word` содержит похожее но отличное слово.
    - При запросе клиент передаёт `locale`, сервер ищет подходящий пак; если нет — fallback на `en`.

    ### FeatureConfig
    Управление feature flags и контент-гейтингом. Клиент получает весь конфиг одним запросом `GET /config` при старте.
    Флаги кешируются на клиенте с TTL 15–30 мин. `payload` может содержать лимиты AI-запросов для free-tier.
    Ключи: `"ai_theme"`, `"premium_categories"`, `"party_mode_extra_roles"`.

    ### AITopicRequestLog
    Лог запросов на AI-генерацию — для дебага, модерации, rate limiting. Хранится для аудита, не возвращается клиенту.
    `device_id` анонимный, не привязан к аккаунту. `raw_prompt` не логируется — может содержать персональные данные.
    `was_rejected = true` если prompt не прошёл модерацию. Retention: записи удаляются через 90 дней.

    ### LocalizationContent
    Серверные строки локализации для контента который нельзя обновить без релиза (paywall, onboarding, promo).
    Только для строк требующих серверного управления — большинство строк идут через нативный Localizable.strings.

    ---

    ## Логика Party Mode

    ### Роли

    **Civilian** — знает слово. Цель — вычислить импостера и проголосовать за него.

    **Impostor** — не знает слово. Цель — не спалиться и выжить до победного условия.
    Взаимоисключает Undercover: в матче либо Impostor либо Undercover на каждый импостер-слот.
    При 2 импостерах возможна комбинация 1 Impostor + 1 Undercover.

    **Undercover** — заменяет Impostor. Получает слово похожее на слово civilians но не то же самое.
    Задача civilians — вычислить что его слово отличается. Задача Undercover — убедить всех что он civilian.

    **Detective** *(дополнительная роль, поверх состава)* — является civilian, знает слово, играет на стороне мирных.
    Абилка: может проверить одного игрока и получить подсказку является ли тот импостером.
    Начинает с 0 зарядами. Заряд добавляется каждые 2 хода. Первая проверка доступна после хода 2.
    Может быть исключён из матча в настройках.

    **Joker** *(дополнительная роль, поверх состава)* — знает слово civilians.
    Выигрывает если: импостер был выгнан первым → после этого выгнали Joker.
    Проигрывает если дошло до ситуации 1 civilian + Joker без импостера → победа civilians.
    Требует минимум 2 civilians (не считая себя) и минимум 2 импостера — иначе роль не назначается.
    Причина: при 1 импостере civilians побеждают сразу после его выгона и у Joker нет шанса реализовать условие.
    Может быть исключён из матча в настройках.

    ### Условия победы
    - **Civilians** — все импостеры (Impostor/Undercover) выгнаны голосованием
    - **Impostor/Undercover** — остались 1 на 1 с civilians (без учёта Joker)
    - **Joker** — импостер выгнан первым → следующим голосованием выгнан Joker

    ### Валидация состава матча
    - Detective и Joker могут присутствовать одновременно если позволяет число игроков.
    - Joker не назначается если civilians < 2 (не считая Joker) или импостеров < 2.
    - Detective и Joker назначаются случайно из пула civilians.
    - Настройки матча позволяют включить/выключить каждую дополнительную роль отдельно.
    - Double Impostor — не роль, а настройка матча (количество импостер-слотов = 2).

    ---

    ## Логика AI-генерации слов

    ### Флоу генерации темы (POST /ai/generate-theme)
    1. Клиент отправляет: `{ topic, locale, mode }`.
    2. Сервер очищает prompt: обрезает до 80 символов, убирает спецсимволы.
    3. Сервер проверяет тему по blacklist (список запрещённых слов/паттернов на regex).
    4. Если blocked → возвращает `fallback_used: true` + случайный curated word. Клиент получает 200, не ошибку.
    5. Если прошло → проверяет пул слов для данного `sanitized_prompt + locale`:
       - Из пула исключаются слова уже выданные этому `device_id`.
       - Если остались доступные слова → выдаётся одно случайное из них.
       - Если все слова пула исчерпаны → переходим к шагу 6.
    6. Если нет доступных слов → формирует системный промпт для LLM (язык, режим, guardrails).
    7. Вызов LLM. Таймаут: 5 секунд.
    8. Парсинг и валидация ответа LLM.
    9. Post-generation проверка через OpenAI Moderation API.
    10. Новые слова добавляются в пул. Выдаётся одно случайное из только что полученных новых слов.
    11. Логирование в AITopicRequestLog.
    12. Возврат клиенту.

    ### Логика пула слов
    - Пул хранится в Redis с ключом `topic_pool:{sanitized_prompt}:{locale}`. Без TTL — накапливается со временем.
    - История выданных слов хранится на сервере: ключ `device_history:{device_id}:{sanitized_prompt}:{locale}`. TTL: 30 дней.
    - При каждом запросе сервер сам исключает из пула слова уже выданные этому устройству — клиент ничего дополнительно не передаёт.

    ### Fallback-цепочка
    - LLM timeout (5 сек) → случайный word из категории с похожими тегами.
    - Moderation rejected → curated fallback из default категории.
    - Rate limit exceeded → curated fallback из default категории.
    - `500` только если вообще нет контента для fallback (не должно происходить в production).

    ### Флоу генерации слов по теме (POST /ai/generate-words)
    Аналогично generate-theme, но список из N слов для полного WordPack.
    Используется для admin-панели и контент-команды в MVP. Лимит: 20–30 слов на запрос.
    В Phase 2 планируется как клиентский эндпоинт.

    ---

    ## Логика premium / paywall

    Premium-статус управляется через Adapty. После успешной покупки в StoreKit 2 Adapty
    автоматически отправляет webhook на `POST /webhooks/adapty` — сервер обновляет `is_premium`
    и `premium_expires_at` в профиле пользователя. Клиент читает актуальный статус через `GET /users/me`.

    ---

    ## Логика категорий и контента

    - `GET /categories` — возвращает все активные категории. TTL кеша: 30 мин. Пагинация не нужна (< 50 категорий).
    - `GET /categories/premium` — только premium с `preview_words` (2–3 слова) для paywall-экрана.
    - `GET /categories/{id}/words` — для premium проверяет `is_premium` в профиле пользователя.
    - Offline-категории бандлятся в приложение. Premium online-категории — запрос к API при наличии интернета.

    ---

    ## Remote Config

    Запрашивается при каждом cold start. Кешируется локально с TTL 15–30 мин.
    При недоступности сервера клиент использует last known good config.
    Критические флаги (force update) проверяются до входа в игру.

    ---

    ## Rate Limiting

    | Endpoint | Free | Premium |
    |---|---|---|
    | POST /ai/generate-theme | 5 / 24h / device | 50 / 24h / device |
    | POST /ai/generate-words | только admin | только admin |
    | GET /categories/{id}/words | 100 / 24h / device | unlimited |
    | GET /categories | unlimited | unlimited |
    | GET /config | unlimited | unlimited |

    - Rate limit по `device_id` (anonymous), не по IP.
    - Окно: rolling 24 hours (не сброс в midnight UTC). Хранилище: Redis.
    - При превышении → ответ `429` с телом (`fallback_used: true` + curated слово) — клиент обрабатывает как успех.
    - Заголовки в ответе: `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset` (Unix timestamp).

    ---

    ## Контент-модерация

    Слои защиты:
    1. **Client-side** — ограничение длины prompt (80 символов), базовый UI hint.
    2. **Server blacklist** — список запрещённых слов/паттернов на regex.
    3. **System prompt guardrails** — инструкции LLM отказать на NSFW/hate/illegal.
    4. **Post-generation check** — ответ LLM проверяется через OpenAI Moderation API.
    5. **Logging** — все rejected requests логируются в AITopicRequestLog для аудита.

    Клиент всегда получает валидный ответ 200 — никогда не отдавать "запрос заблокирован" как ошибку.

    ---

    ## Нефункциональные требования

    | Требование | Значение |
    |---|---|
    | P95 latency /ai/generate-theme | < 3 секунды |
    | P95 latency /categories, /config | < 200 мс |
    | Uptime | 99.5% |
    | Rate limit storage | Redis |
    | AI topic word pool | Redis, без TTL |
    | Device history TTL | 30 дней |
    | Categories cache | Redis, TTL 30 мин |
    | Localizations cache | Redis, TTL 1h |
    | LLM таймаут | 5 секунд |
    | LLM fallback | немедленный, transparent для клиента |
    | AITopicRequestLog retention | 90 дней, затем удаление |
    | JWT алгоритм (access_token) | RS256 |
    | Rate limit window | Rolling 24h (не UTC midnight сброс) |

    ---

    ## Флоу запуска игры (iOS)

    Игра полностью локальная — сервер не ведёт игровую сессию, не знает о составе игроков и ходах.
    Вся игровая логика (раздача ролей, голосование, победа) выполняется на клиенте.
    Сервер отвечает только за контент (слова), конфиг и профиль пользователя.

    ### Cold Start (при каждом запуске приложения)

    Два параллельных запроса:
    - `GET /config` — feature flags, лимиты, force update, maintenance mode
    - `GET /localizations` — paywall/onboarding тексты (если нужны на текущем экране)

    Клиент кеширует оба ответа локально с TTL из `Cache-Control`. При недоступности сервера — использует последний known good.
    Критическая проверка до входа в игру: `app.force_update_version` и `app.maintenance_mode` из `/config`.

    ### Экран выбора категории

    `GET /categories?locale={locale}` — все активные категории (free + premium) с флагом `is_premium`.
    Клиент рисует lock-иконку на premium-категориях на основе `is_premium` из профиля пользователя.

    Если пользователь нажимает на premium-категорию без подписки → показывает paywall. Перед paywall-экраном:
    `GET /categories/premium?locale={locale}` — premium-категории с `preview_words` для отображения на paywall.
    После покупки через StoreKit 2 Adapty присылает webhook → сервер обновляет профиль.

    ### Настройка раунда (только клиент, сервер не вызывается)

    Игроки вводят имена, выбирают настройки:
    - Количество импостеров (1 или 2 — Double Impostor)
    - Включить Detective (да/нет)
    - Включить Joker (да/нет)
    - Режим: standard / party

    Валидация состава матча (Joker требует ≥2 civilians и ≥2 импостеров, Detective — дополнительная роль поверх состава) — на клиенте.

    ### Старт раунда — получение слова

    Два взаимоисключающих сценария:

    **Вариант A — категория из библиотеки:**
    `GET /categories/{category_id}/words?locale={locale}&mode={mode}&count=1`
    Клиент получает `WordEntry` с `civilian_word` и `impostor_word` (null для standard).

    **Вариант B — пользователь ввёл свою тему:**
    `POST /ai/generate-theme` с телом `{ topic, locale, mode }`
    Клиент получает `AIThemeResponse` с теми же полями.

    В обоих случаях сервер возвращает одну пару слов. Клиент раздаёт роли локально.

    ### Раздача ролей (только клиент, сервер не участвует)

    1. Клиент определяет список ролей на основе настроек матча и числа игроков.
    2. Перемешивает роли случайно.
    3. Каждый игрок по очереди берёт устройство и видит свою роль + слово.
    4. Civilian → `civilian_word`, Undercover → `impostor_word`, Impostor → слова нет, Detective/Joker → `civilian_word`.

    ### Игровой процесс и завершение (только клиент)

    Сервер не вызывается. Клиент ведёт:
    - Список активных игроков
    - Стадию игры: обсуждение → голосование → результат
    - Заряды Detective (0 зарядов, +1 каждые 2 хода, первая проверка после хода 2)
    - Счётчик выгнанных (для определения победы Joker)

    Проверка победы — на клиенте по условиям ролей из раздела "Логика Party Mode".

    ### Повторный раунд

    Клиент запрашивает новое слово заново — тот же флоу старта раунда.
    Предыдущая сессия на сервер не передаётся.

    ### Диаграмма вызовов по экранам

    ```
    App Launch
      ├── GET /config
      └── GET /localizations

    Category Picker
      └── GET /categories

    [is_premium = false + нажата premium-категория]
      └── GET /categories/premium      → Paywall экран
            └── [покупка через StoreKit 2 → Adapty webhook → профиль обновлён]

    Round Setup
      └── (нет запросов)

    Round Start
      ├── [категория из библиотеки]  GET /categories/{id}/words
      └── [пользователь ввёл тему]   POST /ai/generate-theme

    In-Game
      └── (нет запросов)

    Next Round
      └── повтор Round Start
    ```

    ### Важные детали клиента

    - `X-Device-Id` — UUID, генерируется при первом запуске, хранится в Keychain, передаётся в каждом запросе.
    - Offline для free-категорий: слова бандлятся в приложение, сеть не нужна.
    - Offline для premium: клиент показывает ошибку, игровой flow не ломается.

    ---

    ## Аутентификация API

    Двухуровневая модель доступа:

    ### API_KEY (X-Api-Key)
    Обязателен для всех клиентских эндпоинтов (`/categories`, `/ai/*`, `/config`, `/localizations`, `/users/*`).
    Передаётся в заголовке `X-Api-Key`. Ротируется при компрометации.

    ### ADMIN_API_KEY (X-Admin-Api-Key)
    Обязателен только для `/admin/*` эндпоинтов. Передаётся в заголовке `X-Admin-Api-Key`.
    Предоставляет расширенный доступ: пополнение токенов пользователям, управление контентом.
    Хранится только на стороне сервера и доверенных admin-клиентов. Никогда не передаётся в мобильное приложение.

    ### Webhooks
    Эндпоинты `/webhooks/*` не используют стандартный `X-Api-Key`.
    Верификация осуществляется через payload-специфичные заголовки (например, `Adapty-Signature` для Adapty).

    ---

servers:
  - url: https://api.imposterai.app/v1

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
    AdminApiKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-Api-Key

  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Анонимный идентификатор устройства, генерируется при первом запуске
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      schema:
        type: string
        example: "1.0.0"
    LocaleHeader:
      name: X-Locale
      in: header
      required: false
      schema:
        type: string
        example: "ru"
      description: ISO 639-1 код языка

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: RATE_LIMIT_EXCEEDED
            message:
              type: string
              example: AI request limit reached for today
            details:
              nullable: true
              example: null

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: animals
        name:
          type: string
          example: Animals
        description:
          type: string
          example: Guess the animal
        is_premium:
          type: boolean
        is_active:
          type: boolean
        cover_image_url:
          type: string
          nullable: true
          example: https://cdn.../animals.png
        sort_order:
          type: integer
          example: 1

    CategoryPremium:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          properties:
            preview_words:
              type: array
              items:
                type: string
              example: ["Matrix", "Avatar"]

    WordEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        civilian_word:
          type: string
          example: Elephant
        impostor_word:
          type: string
          nullable: true
          example: null
        difficulty:
          type: string
          enum: [easy, medium, hard]
        tags:
          type: array
          items:
            type: string
          example: []

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Внутренний идентификатор пользователя
        device_id:
          type: string
          format: uuid
          description: Анонимный идентификатор устройства
        tokens:
          type: integer
          default: 0
          description: Текущий баланс токенов
        is_premium:
          type: boolean
          description: Наличие активной premium-подписки
        premium_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Дата истечения premium-подписки (null если нет подписки)
        created_at:
          type: string
          format: date-time
          description: Дата и время регистрации пользователя
      required:
        - id
        - device_id
        - tokens
        - is_premium
        - created_at

    CreateUserRequest:
      type: object
      required: [device_id]
      properties:
        device_id:
          type: string
          format: uuid
          description: Анонимный идентификатор устройства

    AddTokensRequest:
      type: object
      required: [device_id, tokens_amount]
      properties:
        device_id:
          type: string
          format: uuid
          description: device_id пользователя
        tokens_amount:
          type: integer
          minimum: 1
          description: Количество токенов для начисления

    AdaptyWebhookPayload:
      type: object
      required: [event_type, profile_id]
      properties:
        event_type:
          type: string
          example: subscription_renewed
          description: Тип события Adapty
        profile_id:
          type: string
          description: Внутренний ID профиля Adapty
        customer_user_id:
          type: string
          nullable: true
          description: |
            customer_user_id в Adapty — равен device_id пользователя.
            По этому полю сервер находит пользователя при обработке события.
        paid_access_level:
          type: object
          nullable: true
          description: Данные уровня доступа (premium entitlement)
          properties:
            id:
              type: string
              example: premium
            is_active:
              type: boolean
            expires_at:
              type: string
              format: date-time
              nullable: true
        additionalProperties: true

    AIThemeResponse:
      type: object
      properties:
        locale:
          type: string
          example: ru
        topic:
          type: string
          example: космос
        civilian_word:
          type: string
          example: Марс
        impostor_word:
          type: string
          nullable: true
          example: null
        difficulty:
          type: string
          enum: [easy, medium, hard]
        is_safe:
          type: boolean
        fallback_used:
          type: boolean
        fallback_reason:
          type: string
          nullable: true
          enum: [ai_unavailable, moderation_rejected, rate_limit_exceeded]

paths:
  /categories:
    get:
      summary: Список всех активных категорий
      description: Возвращает все активные категории (free + premium) для отображения в пикере.
      tags: [Categories]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/LocaleHeader'
        - name: locale
