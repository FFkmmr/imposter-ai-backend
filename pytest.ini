[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
pythonpath = api
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── output ─────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --no-header
    -p no:warnings

log_cli = true
log_cli_level = INFO
log_format = %(levelname)-8s %(name)s: %(message)s
